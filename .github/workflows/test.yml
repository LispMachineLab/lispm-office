name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Emacs ${{ matrix.emacs }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs: ['30.1', '31.1']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: LispMachineLab/lispm-kit
          ref: a6cbb26aa2de9429981c9dda680f64c2664e6542
          path: .deps/lispm-kit
      - uses: actions/checkout@v7
        with:
          repository: LispMachineLab/lispm-ui
          ref: 62c2a38084fdf75988206027328e7e725ff57b44
          path: .deps/lispm-ui
      - uses: actions/checkout@v7
        with:
          repository: LispMachineLab/lispm-agent
          # Agent 0.15.0 public project renderer and cached scope API.
          ref: d0b924b0932097f5cee9f679fcae2aaf4fd8b166
          path: .deps/lispm-agent
      - uses: purcell/setup-emacs@v8.0
        with:
          version: ${{ matrix.emacs }}
      - name: Test and compile
        run: make test compile LISPM_KIT=.deps/lispm-kit LISPM_UI=.deps/lispm-ui LISPM_AGENT=.deps/lispm-agent/lisp
