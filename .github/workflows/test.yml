name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Emacs ${{ matrix.emacs }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs: ['30.1', '31.1']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: LispMachineLab/lispm-ui
          ref: 5b934ab950929a5337a5ca17b12cb18e8fa3777b
          path: .deps/lispm-ui
      - uses: actions/checkout@v7
        with:
          repository: LispMachineLab/lispm-auth
          ref: 085bcd5c4e6d82eeb6789ec8b416c030bac7006d
          path: .deps/lispm-auth
      - uses: actions/checkout@v7
        with:
          repository: LispMachineLab/lispm-agent
          # Agent 0.20.1 roster key and details support for chat buffers and background helpers.
          ref: 1b49c47886c677c6feabb4766172f5abc35628a8
          path: .deps/lispm-agent
      - uses: purcell/setup-emacs@v8.0
        with:
          version: ${{ matrix.emacs }}
      - name: Test and compile
        run: make test compile LISPM_UI=.deps/lispm-ui LISPM_AUTH=.deps/lispm-auth LISPM_AGENT=.deps/lispm-agent/lisp
